[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyannote-community1-dual-output"
version = "1.3.0"
description = "GPU pyannote Community-1 with TensorRT acceleration and dual diarization outputs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyannote.audio==4.0.7",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "torchcodec==0.9.1",
  "huggingface_hub==1.30.0",
  "numpy==2.4.6",
]

[project.scripts]
pyannote-dual = "pyannote_dual.cli:main"
pyannote-dual-batch = "pyannote_dual.batch:main"
pyannote-dual-serve = "pyannote_dual.service:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
